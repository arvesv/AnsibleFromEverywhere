---
name: CI

"on":
  push:
    branches: ["main", "master", "everywhere"]
  pull_request:
    branches: ["main", "master", "everywhere"]
  workflow_dispatch:

jobs:
  lint:
    name: Lint Ansible Playbooks & Roles
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ansible collections
        run: |
          for i in 1 2 3; do
            ansible-galaxy collection install -r requirements.yml -p collections && break || sleep 5
          done

      - name: Initialize inventory from template
        run: |
          mkdir -p inventory
          if [ ! -f inventory/hosts.yml ]; then
            if [ -f inventory/hosts.yml.template ]; then
              cp inventory/hosts.yml.template inventory/hosts.yml
            elif [ -f hosts.yml.template ]; then
              cp hosts.yml.template inventory/hosts.yml
            elif [ -f host.template ]; then
              cp host.template inventory/hosts.yml
            fi
          fi

      - name: Run Ansible Lint
        run: |
          ansible-lint

  smoke-test:
    name: Playbook Syntax & Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ansible collections
        run: |
          for i in 1 2 3; do
            ansible-galaxy collection install -r requirements.yml -p collections && break || sleep 5
          done

      - name: Initialize inventory from template
        run: |
          mkdir -p inventory
          if [ ! -f inventory/hosts.yml ]; then
            if [ -f inventory/hosts.yml.template ]; then
              cp inventory/hosts.yml.template inventory/hosts.yml
            elif [ -f hosts.yml.template ]; then
              cp hosts.yml.template inventory/hosts.yml
            elif [ -f host.template ]; then
              cp host.template inventory/hosts.yml
            fi
          fi

      - name: Playbook syntax check
        run: |
          ansible-playbook --syntax-check playbooks/hello-world.yml site.yml

      - name: Run hello-world playbook on localhost
        run: |
          ansible-playbook -i 'localhost,' -c local playbooks/hello-world.yml
