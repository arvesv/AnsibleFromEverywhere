name: CI

on:
  push:
    branches: ["main", "master", "everywhere"]
  pull_request:
    branches: ["main", "master", "everywhere"]
  workflow_dispatch:

jobs:
  lint:
    name: Lint Ansible Playbooks & Roles
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r requirements.yml -p collections

      - name: Run Ansible Lint
        run: |
          ansible-lint

  smoke-test:
    name: Playbook Syntax & Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r requirements.yml -p collections

      - name: Initialize inventory from template
        run: |
          if [ ! -f inventory/hosts.yml ]; then
            cp host.template inventory/hosts.yml
          fi

      - name: Playbook syntax check
        run: |
          ansible-playbook --syntax-check playbooks/hello-world.yml site.yml

      - name: Run hello-world playbook on localhost
        run: |
          ansible-playbook -i 'localhost,' -c local playbooks/hello-world.yml

